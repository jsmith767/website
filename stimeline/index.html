<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sexual Health Timeline</title>
  <style>
    :root { --fs: 12px; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: #000;
      font-family: Verdana, "DejaVu Sans", Geneva, sans-serif;
      font-size: var(--fs);
    }
    main { max-width: 1020px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; margin: 4px 0 12px; }

    #legend {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 4px 16px;
      font-size: 14px;
      border: 2px solid #000;
      padding: 10px 12px;
    }
    .lg { display: flex; align-items: center; gap: 6px; }
    .lg .sym { width: 44px; display: flex; justify-content: flex-end; align-items: center; flex: none; }
    .lg .sym .pic { height: 1.6em; }
    .lg .sym .pic.penis, .lg .sym .pic.mouth { height: 1.1em; }
    .note { font-size: 13px; line-height: 1.4; margin: 12px 0 4px; }

    #tl { position: relative; margin-top: 8px; }
    #tl.small { --fs: 10.5px; font-size: var(--fs); }
    #tl svg.gfx { position: absolute; left: 0; top: 0; pointer-events: none; font-family: inherit; }

    .box {
      position: relative;
      border: 2px solid #000;
      background: #fff;
      padding: 4px 7px;
      line-height: 1.3;
    }
    .lbox { position: absolute; z-index: 1; white-space: pre-line; }
    .chain {
      position: absolute;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
      padding-left: 8px;
      border-left: 2px solid transparent;
    }
    .chain.wrapped { border-left-color: #000; }
    .chain .box + .box::before {
      content: "";
      position: absolute;
      left: -16px;
      width: 14px;
      top: 50%;
      margin-top: -1px;
      border-top: 2px solid #000;
    }
    .chain .box.rowstart::before { display: none; }
    .chain .box.text { max-width: min(16em, 100%); }
    .chain .box.text.long { max-width: min(25em, 100%); }
    .chain .box.info { border-width: 4px; font-size: 1.2em; padding: 8px 10px; max-width: min(21em, 100%); }
    .box.acts { padding: 4px 6px; }

    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 3px 0; }
    .chain .box { max-width: 100%; }
    .pic { display: block; flex: none; width: auto; height: 1.4em; }
    .pic.vagina { height: 2em; }
    .pic.hand { height: 1.9em; }
    .pic.hand.small { height: 1.1em; }
    .pic.tested { display: inline-block; height: 1.9em; vertical-align: middle; }
    .stack { display: flex; flex-direction: column; align-items: center; }
    .nosti { font-family: Arial, Helvetica, sans-serif; font-size: 1.45em; white-space: nowrap; vertical-align: middle; }
    .nosti b { color: #e60000; font-weight: normal; }
    .t .nosti:first-child { display: inline-block; }
  </style>
</head>
<body>
  <main>
    <h1>Sexual Health Timeline</h1>
    <div id="legend"></div>
    <p class="note">Hand to genital activity is not shown except in cases where there is a reasonable risk of the hand being a vector between other areas (e.g. genital-hand-genital, genital-hand-mouth, etc).</p>
    <div id="tl"></div>
  </main>
  <script src="data.js"></script>
  <script src="timeline.js"></script>
</body>
</html>
