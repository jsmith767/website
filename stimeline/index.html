<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sexual Health Timeline</title>
  <style>
    :root { --fs: 12px; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.4;
    }
    main { max-width: 1020px; margin: 0 auto; padding: 16px; }
    #editlink {
      float: right;
      margin-top: 4px;
      padding: 5px 14px;
      border: 1.5px solid #000;
      border-radius: 4px;
      color: #000;
      background: #fff;
      text-decoration: none;
      font-size: 14px;
    }
    #editlink:hover { background: #000; color: #fff; }
    details.sec { border-bottom: 1px solid #ccc; padding: 12px 0; }
    details.sec:last-of-type { border-bottom: 0; }
    details.sec > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: 4px;
    }
    details.sec > summary::-webkit-details-marker { display: none; }
    details.sec > summary::before {
      content: "";
      flex: none;
      width: 9px;
      height: 9px;
      margin: 0 2px 0 4px;
      border-right: 3px solid #000;
      border-bottom: 3px solid #000;
      transform: rotate(-45deg);
      transition: transform .15s;
    }
    details.sec[open] > summary::before { transform: rotate(45deg) translate(-2px, -2px); }
    details.sec > summary:hover h2 { text-decoration: underline; }
    h2 { font-size: 24px; margin: 0; }
    .sec > ul { padding-left: 46px; margin: 4px 0 0; }
    .sec li { margin-top: 10px; }
    .sec li ul { list-style-type: circle; padding-left: 20px; margin-top: 5px; }
    .sec li li { margin-top: 4px; }
    .sec .gdot { display: inline-block; width: .8em; height: .8em; border-radius: 50%; border: 1.5px solid #000; margin-right: 2px; vertical-align: baseline; }
    .sec .ctx { color: #333; font-style: italic; }
    #glance .pic.tested { height: 1.3em; }
    #glance .nosti { font-size: 1em; }
    .sec .auto { margin: 10px 0 0 46px; font-size: 13px; color: #555; }

    #legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 44px;
      align-items: flex-start;
      margin: 16px 0 8px;
      font-family: Verdana, "DejaVu Sans", Geneva, sans-serif;
      font-size: 14px;
    }
    .lgroup { display: flex; flex-direction: column; gap: 3px; }
    .lgroup.main { font-size: 20px; font-weight: bold; gap: 6px; }
    .lg { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .lg .sym { width: 2.6em; display: flex; justify-content: flex-end; align-items: center; flex: none; }
    .lgroup.abbr .sym { width: 1.2em; font-weight: normal; }
    .lg .sym .pic { height: 1.6em; }
    .lgroup.main .sym .pic { height: 1.7em; }
    .lg .sym .pic.penis, .lg .sym .pic.mouth { height: 1.05em; }

    #tl { position: relative; margin-top: 8px; font-family: Verdana, "DejaVu Sans", Geneva, sans-serif; font-size: 12px; line-height: normal; }
    #tl.small { font-size: 10.5px; }
    #tl .empty { font-family: Arial, Helvetica, sans-serif; font-size: 16px; color: #555; padding: 24px 0; margin: 0; }
    #tl svg.gfx { position: absolute; left: 0; top: 0; pointer-events: none; font-family: inherit; }

    .box {
      position: relative;
      border: 2px solid #000;
      background: #fff;
      padding: 4px 7px;
      line-height: 1.3;
    }
    .lbox { position: absolute; z-index: 1; white-space: pre-line; }
    .chain {
      position: absolute;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
      padding-left: 8px;
      border-left: 2px solid transparent;
    }
    .chain.wrapped { border-left-color: #000; }
    .chain .box + .box::before {
      content: "";
      position: absolute;
      left: -16px;
      width: 14px;
      top: 50%;
      margin-top: -1px;
      border-top: 2px solid #000;
    }
    .chain .box.rowstart::before { display: none; }
    .chain .box.text { max-width: min(16em, 100%); }
    .chain .box.text.long { max-width: min(25em, 100%); }
    .chain .box.info { border-width: 4px; font-size: 1.2em; padding: 8px 10px; max-width: min(21em, 100%); }
    .box.acts { padding: 4px 6px; }

    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 3px 0; }
    .chain .box { max-width: 100%; }
    .pic { display: block; flex: none; width: auto; height: 1.4em; }
    .pic.vagina { height: 2em; }
    .pic.hand { height: 1.9em; }
    .pic.hand.small { height: 1.1em; }
    .pic.tested { display: inline-block; height: 1.9em; vertical-align: middle; }
    .stack { display: flex; flex-direction: column; align-items: center; }
    .nosti { font-family: Arial, Helvetica, sans-serif; font-size: 1.45em; white-space: nowrap; vertical-align: middle; }
    .nosti b { color: #e60000; font-weight: normal; }
    .t .nosti:first-child { display: inline-block; }
  </style>
</head>
<body>
  <main>
    <a id="editlink" href="?edit">Edit</a>
    <details class="sec" id="boundaries">
      <summary><h2>Boundaries</h2></summary>
      <ul data-about="boundaries"></ul>
    </details>
    <details class="sec" id="glance" open hidden>
      <summary><h2>At a Glance</h2></summary>
      <ul></ul>
      <p class="auto">Worked out automatically from the entries on the timeline below. Self-reported.</p>
    </details>
    <details class="sec" id="summary">
      <summary><h2>Sexual Health Summary</h2></summary>
      <ul data-about="summary"></ul>
    </details>
    <details class="sec" id="timeline" open>
      <summary><h2>Timeline</h2></summary>
      <ul data-about="note"></ul>
    <div id="legend"></div>
    <div id="editor"></div>
    <div id="tl"></div>
    </details>
  </main>
  <script src="data.js?v=20261006103152"></script>
  <script src="timeline.js?v=20261006103152"></script>
  <script src="editor.js?v=20261006103152"></script>
</body>
</html>
