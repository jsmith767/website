<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sahale Movie List</title>
<style>
  :root {
    --bg: #faf6f0; --card: #ffffff; --ink: #2a2420; --muted: #75695f;
    --line: #e6ddd2; --accent: #b4452f; --chip: #f2ebe2;
    --good: #3f8f4f; --mid: #c08a1e; --low: #b4452f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17130f; --card: #221c17; --ink: #f1e9df; --muted: #a8998a;
            --line: #3a3029; --accent: #e07a5f; --chip: #2e2620; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  a { color: var(--accent); }
  button, select, input { font: inherit; color: inherit; }

  /* Search and filters */
  .search { width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px;
            background: var(--card); font-size: 1rem; }
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 14px;
             margin: 12px 0 0; padding: 14px; background: var(--card); border: 1px solid var(--line);
             border-radius: 12px; }
  .filters[hidden] { display: none; }
  .filters label { display: flex; flex-direction: column; gap: 3px; font-size: .78rem;
                   text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .filters select, .filters input[type=number] { padding: 6px 8px; border: 1px solid var(--line);
                   border-radius: 8px; background: var(--bg); text-transform: none; letter-spacing: 0; font-size: .92rem; }
  .filters input[type=range] { width: 100%; accent-color: var(--accent); }
  .yr { display: flex; gap: 6px; align-items: center; }
  .yr input { width: 100%; min-width: 0; }
  .filters .check { flex-direction: row; align-items: center; gap: 6px; text-transform: none;
                    letter-spacing: 0; font-size: .92rem; color: var(--ink); }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 14px 0 18px; }
  .bar .count { color: var(--muted); font-size: .9rem; margin-right: auto; }
  .bar select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
  .btn { padding: 6px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
         cursor: pointer; line-height: 1.2; }
  .btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .link-btn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: .9rem; }

  /* Cards */
  #list { display: grid; gap: 22px; }
  .film { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .trailer { position: relative; aspect-ratio: 16/9; background: #000 center/cover no-repeat;
             cursor: pointer; border: 0; width: 100%; display: block; padding: 0; }
  .trailer::after { content: ""; position: absolute; inset: 0;
                    background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0) 55%); }
  .play { position: absolute; z-index: 1; left: 50%; top: 50%; transform: translate(-50%,-50%);
          width: 76px; height: 76px; border-radius: 50%; background: rgba(180,69,47,.92);
          display: grid; place-items: center; transition: transform .15s; }
  .trailer:hover .play { transform: translate(-50%,-50%) scale(1.08); }
  .play svg { width: 30px; height: 30px; margin-left: 5px; fill: #fff; }
  .trailer .label { position: absolute; z-index: 1; left: 16px; bottom: 12px; color: #fff;
                    font-weight: 600; font-size: .9rem; }
  .trailer iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 2; }
  .no-trailer { padding: 22px 16px; background: var(--chip); color: var(--muted); font-size: .95rem; }
  .body { padding: 18px 20px 20px; }
  .head { display: flex; align-items: flex-start; gap: 14px; }
  .head .titles { flex: 1; min-width: 0; }
  h2 { margin: 0; font-size: 1.4rem; }
  .meta { color: var(--muted); font-size: .92rem; margin: 2px 0 12px; }
  .score { flex: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
           color: #fff; font-weight: 700; font-size: 1.1rem; background: var(--muted); }
  .score.good { background: var(--good); } .score.mid { background: var(--mid); } .score.low { background: var(--low); }
  .ratings { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 3px 11px; font-size: .85rem; }
  .chip b { font-weight: 700; }
  .genre { cursor: pointer; border: 0; }
  .genre:hover { outline: 1px solid var(--accent); }
  p { margin: 0 0 12px; }
  .watch { border-top: 1px solid var(--line); padding-top: 12px; font-size: .95rem; }
  .watch strong { color: var(--accent); }
  .links { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 14px; font-size: .9rem; align-items: center; }
  .seen { margin-left: auto; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .film.done { opacity: .6; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }

  /* Grid view: compact poster-style tiles */
  #list.grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  #list.grid .desc, #list.grid .watch, #list.grid .links a, #list.grid .genres { display: none; }
  #list.grid .body { padding: 12px 14px 14px; }
  #list.grid h2 { font-size: 1.05rem; }
  #list.grid .meta { font-size: .82rem; margin-bottom: 8px; }
  #list.grid .score { width: 40px; height: 40px; font-size: .9rem; }
  #list.grid .play { width: 52px; height: 52px; } #list.grid .play svg { width: 20px; height: 20px; }
  #list.grid .ratings { margin-bottom: 6px; }

  .note { color: var(--muted); font-size: .85rem; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <h1>Sahale Movie List</h1>
  <p class="sub">Movies suggested by and for Sahale residents. Tap a trailer to play it.</p>

  <input id="q" class="search" type="search" placeholder="Search titles, people, descriptions…" aria-label="Search">

  <div class="bar" style="margin-top:10px">
    <button id="toggleFilters" class="link-btn" aria-expanded="false">Filters ▾</button>
    <button id="reset" class="link-btn">↺ Reset</button>
  </div>
  <div id="filters" class="filters" hidden>
    <label>Type
      <select id="fType"><option value="">All</option><option>Movie</option><option>Series</option></select></label>
    <label>Where to watch
      <select id="fWhere"><option value="">Anywhere</option></select></label>
    <label>Genre
      <select id="fGenre"><option value="">All genres</option></select></label>
    <label>Exclude genre
      <select id="fNotGenre"><option value="">None</option></select></label>
    <label>Year
      <span class="yr"><input id="fYearMin" type="number" aria-label="From year"> –
        <input id="fYearMax" type="number" aria-label="To year"></span></label>
    <label>Min. average score: <span id="fScoreVal">0</span>
      <input id="fScore" type="range" min="0" max="100" step="5" value="0"></label>
    <label class="check"><input id="fHideSeen" type="checkbox"> Hide watched</label>
  </div>

  <div class="bar">
    <span id="count" class="count"></span>
    <label for="sort" style="font-size:.9rem;color:var(--muted)">Sort by</label>
    <select id="sort">
      <option value="score">Average score</option>
      <option value="rt">Rotten Tomatoes</option>
      <option value="imdb">IMDb</option>
      <option value="year">Year</option>
      <option value="title">Title</option>
      <option value="mins">Length</option>
      <option value="added">Recently added</option>
    </select>
    <button id="dir" class="btn" title="Flip sort direction" aria-label="Flip sort direction">↓</button>
    <button id="vList" class="btn on" title="List view" aria-label="List view">☰</button>
    <button id="vGrid" class="btn" title="Grid view" aria-label="Grid view">▦</button>
  </div>

  <div id="list"></div>

  <p class="note">"Average score" averages whichever of Rotten Tomatoes critics, RT audience and IMDb (×10) are available.
    "Watched" ticks are saved on this device only. Info as of October 2026.</p>
</main>

<script>
/*
  The list. To add a film, copy a block and fill it in. Leave a rating as null if unknown.
  yt = YouTube video id of the trailer (the part after watch?v=), or null.
  where = places to watch (used by the "Where to watch" filter).
*/
var FILMS = [
  {
    id: 'bride', title: 'The Bride!', type: 'Movie', year: 2026, rated: 'R', mins: 126,
    genres: ['Horror', 'Romance', 'Fantasy'], who: 'Dir. Maggie Gyllenhaal',
    rt: 59, aud: null, imdb: 5.7, yt: 'IhgcUArO3Uo', added: 1,
    desc: "Maggie Gyllenhaal's punk, 1930s-Chicago reimagining of the Bride of Frankenstein. A lonely Frankenstein's monster (Christian Bale) gets a murdered young woman (Jessie Buckley) brought back to life as his companion, and she turns out to have a will of her own. With Peter Sarsgaard, Annette Bening, Penélope Cruz and Jake Gyllenhaal. Critics split: big, wild swings that some loved and some found messy.",
    where: ['HBO Max', 'Prime Video (rent)', 'Apple TV (rent)'],
    watch: 'Streaming on <b>HBO Max</b> (since May 22, 2026). Also rent/buy on Prime Video, Apple TV and Fandango at Home.',
    links: { IMDb: 'https://www.imdb.com/title/tt30851137/', 'Rotten Tomatoes': 'https://www.rottentomatoes.com/m/the_bride_2026' }
  },
  {
    id: 'mothermary', title: 'Mother Mary', type: 'Movie', year: 2026, rated: 'R', mins: 112,
    genres: ['Drama', 'Music', 'Psychological'], who: 'Dir. David Lowery · A24',
    rt: 71, aud: 59, imdb: null, yt: 'ATGaqU6Srcc', added: 2,
    desc: "A world-famous pop star (Anne Hathaway) reunites with the costume designer (Michaela Coel) she fell out with years ago, on the eve of a comeback, and the meeting forces her to face her past. From the director of <i>A Ghost Story</i> and <i>The Green Knight</i>, with original songs, Hunter Schafer, Kaia Gerber and FKA Twigs. Moody, strange and divisive.",
    where: ['HBO Max', 'Apple TV (rent)'],
    watch: 'Streaming on <b>HBO Max</b> (since Aug 21, 2026). Also rent/buy on Apple TV and other stores.',
    links: { IMDb: 'https://www.imdb.com/title/tt27200708/', 'Rotten Tomatoes': 'https://www.rottentomatoes.com/m/mother_mary' }
  },
  {
    id: 'backrooms', title: 'Backrooms', type: 'Movie', year: 2026, rated: 'R', mins: 105,
    genres: ['Horror', 'Sci-Fi'], who: 'Dir. Kane Parsons · A24',
    rt: 87, aud: null, imdb: 6.8, yt: '0HjdiohVOik', added: 3,
    desc: "Based on Kane Parsons' viral YouTube series. A furniture-store owner (Chiwetel Ejiofor) finds a doorway in his basement that opens onto an endless maze of empty, humming yellow rooms where reality stops following the rules. With Renate Reinsve and Mark Duplass. Became A24's biggest movie ever (~$367M worldwide).",
    where: ['HBO Max', 'Prime Video (rent)', 'Apple TV (rent)'],
    watch: 'Streaming on <b>HBO Max</b> (since Sept 25, 2026). Also rent/buy on Prime Video and Apple TV.',
    links: { IMDb: 'https://www.imdb.com/find/?q=Backrooms%202026', 'Rotten Tomatoes': 'https://www.rottentomatoes.com/search?search=backrooms' }
  },
  {
    id: 'cycleoflove', title: 'The Cycle of Love', type: 'Movie', year: 2026, rated: null, mins: 98,
    genres: ['Documentary', 'Romance'], who: 'Dir. Orlando von Einsiedel · Exec. prod. Priyanka Chopra Jonas',
    rt: null, aud: null, imdb: null, yt: 'biXpA5aJPug', added: 4,
    extraChips: ['🍅 Fresh (few reviews so far)', 'Audience Award, Middleburg'],
    desc: 'The true story of PK Mahanandia, a young street artist from a poor "untouchable" family in Delhi, who in 1977 got on a second-hand bicycle and rode about 6,000 miles across Asia and Europe to Sweden to find Lotta, the woman he loved. Critics call it joyful, delicate and deeply romantic. From the director of <i>Virunga</i> and the Oscar-winning <i>The White Helmets</i>.',
    where: ['Theaters'],
    watch: 'In <b>theaters</b> (limited US release from Aug 28, 2026). Find a screening on the film\'s <a href="https://thecycleoflovefilm.com/buy-tickets/" target="_blank" rel="noopener">tickets page</a>. Not streaming yet.',
    links: { 'Official site': 'https://thecycleoflovefilm.com/', 'Rotten Tomatoes': 'https://www.rottentomatoes.com/m/the_cycle_of_love', Wikipedia: 'https://en.wikipedia.org/wiki/The_Cycle_of_Love' }
  },
  {
    id: 'seekers', title: 'Seekers: How to Be Human', type: 'Series', year: 2026, rated: null, mins: 270,
    length: '6 episodes (~45 min each)',
    genres: ['Documentary', 'Spirituality'], who: 'Created & directed by Gio Israel',
    rt: null, aud: null, imdb: null, yt: null, added: 5,
    noTrailer: 'Trailer is free to watch on <a href="https://seekers.co" target="_blank" rel="noopener">seekers.co</a>',
    extraChips: ['Festival selections & awards 2025–26', 'No IMDb/RT scores yet'],
    desc: 'Six people going through something hard (grief, depression, war trauma, losing their sense of self) each travel to meet a wisdom keeper from a living tradition, across four continents. Pairings include Riley Keough with Jack Kornfield and Trudy Goodman, Édgar Ramírez with Ammaji Swaminii Pramananda, Jamie-Lynn Sigler with Swami Nardinand, and Mona Polacca, Manari Ushigua and Mbuya Rupiya.',
    where: ['seekers.co'],
    watch: 'Directly on <a href="https://seekers.co" target="_blank" rel="noopener">seekers.co</a> ("Start watching"), on a pay-it-forward model.',
    links: {}
  },
  {
    id: 'doubleindemnity', title: 'Double Indemnity', type: 'Movie', year: 1944, rated: 'Approved', mins: 107,
    genres: ['Crime', 'Film Noir', 'Thriller'], who: 'Dir. Billy Wilder',
    rt: 97, aud: 95, imdb: 8.3, yt: 'yKrrAa2o9Eg', added: 6,
    desc: 'The film noir that set the template. An insurance salesman (Fred MacMurray) falls for a married woman (Barbara Stanwyck), and together they plan to kill her husband and collect on a life-insurance policy that pays double for an accident. Edward G. Robinson plays the sharp claims investigator who can smell something wrong. Co-written by Raymond Chandler; seven Oscar nominations.',
    where: ['MGM+', 'Prime Video (rent)', 'Apple TV (rent)'],
    watch: 'Streaming on <b>MGM+</b> (also through Prime Video, Roku or YouTube TV add-ons, and Philo). Rent/buy on Prime Video, Apple TV, Google Play, Fandango at Home and YouTube.',
    links: { IMDb: 'https://www.imdb.com/title/tt0036775/', 'Rotten Tomatoes': 'https://www.rottentomatoes.com/m/double_indemnity' }
  }
];

// ---------- helpers ----------
function avg(f) {
  var s = [f.rt, f.aud, f.imdb != null ? f.imdb * 10 : null].filter(function (x) { return x != null; });
  return s.length ? Math.round(s.reduce(function (a, b) { return a + b; }, 0) / s.length) : null;
}
function fmtLen(f) {
  if (f.length) return f.length;
  var h = Math.floor(f.mins / 60), m = f.mins % 60;
  return (h ? h + 'h ' : '') + (m ? m + 'm' : '');
}
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function strip(html) { return html.replace(/<[^>]*>/g, ''); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function seen(id) { return store('movies-seen-' + id) === '1'; }

FILMS.forEach(function (f) {
  f.score = avg(f);
  f.text = (f.title + ' ' + f.who + ' ' + strip(f.desc) + ' ' + f.genres.join(' ')).toLowerCase();
});

// ---------- fill filter menus ----------
var $ = function (id) { return document.getElementById(id); };
function uniq(key) {
  var all = {}; FILMS.forEach(function (f) { f[key].forEach(function (x) { all[x] = 1; }); });
  return Object.keys(all).sort();
}
function fill(sel, items) { items.forEach(function (x) { var o = document.createElement('option'); o.textContent = x; sel.appendChild(o); }); }
fill($('fWhere'), uniq('where'));
fill($('fGenre'), uniq('genres'));
fill($('fNotGenre'), uniq('genres'));
var years = FILMS.map(function (f) { return f.year; });
var Y0 = Math.min.apply(null, years), Y1 = Math.max.apply(null, years);

// ---------- state ----------
var DEFAULT_DIR = { score: -1, rt: -1, imdb: -1, year: -1, title: 1, mins: 1, added: -1 };
var state = { sort: 'score', dir: -1, view: store('movies-view') || 'list' };

function reset() {
  $('q').value = ''; $('fType').value = ''; $('fWhere').value = ''; $('fGenre').value = '';
  $('fNotGenre').value = ''; $('fYearMin').value = Y0; $('fYearMax').value = Y1;
  $('fScore').value = 0; $('fScoreVal').textContent = 0; $('fHideSeen').checked = false;
  state.sort = $('sort').value = 'score'; state.dir = DEFAULT_DIR.score;
  render();
}

// ---------- render ----------
var PLAY = '<span class="play"><svg viewBox="0 0 24 24"><path d="M6 4l15 8-15 8z"/></svg></span>';

function card(f) {
  var trailer = f.yt
    ? '<button class="trailer" data-yt="' + f.yt + '" style="background-image:url(https://i.ytimg.com/vi/' + f.yt + '/hqdefault.jpg)" aria-label="Play ' + esc(f.title) + ' trailer">' + PLAY + '<span class="label">▶ Official trailer</span></button>'
    : '<div class="no-trailer">' + (f.noTrailer || 'No trailer found yet') + '</div>';
  var sc = f.score, cls = sc == null ? '' : sc >= 75 ? 'good' : sc >= 60 ? 'mid' : 'low';
  var chips = [];
  if (f.rt != null) chips.push('🍅 <b>' + f.rt + '%</b> Rotten Tomatoes');
  if (f.aud != null) chips.push('🍿 <b>' + f.aud + '%</b> audience');
  if (f.imdb != null) chips.push('IMDb <b>' + f.imdb + '</b>/10');
  (f.extraChips || []).forEach(function (c) { chips.push(esc(c)); });
  var meta = [f.year, f.rated, fmtLen(f), f.type === 'Series' ? 'Series' : null, f.who].filter(Boolean).map(esc).join(' · ');
  var links = Object.keys(f.links).map(function (k) { return '<a href="' + f.links[k] + '" target="_blank" rel="noopener">' + esc(k) + '</a>'; }).join('');
  return '<article class="film' + (seen(f.id) ? ' done' : '') + '" data-id="' + f.id + '">' + trailer +
    '<div class="body"><div class="head"><div class="titles"><h2>' + esc(f.title) + '</h2>' +
    '<div class="meta">' + meta + '</div></div>' +
    '<div class="score ' + cls + '" title="Average score">' + (sc == null ? '–' : sc) + '</div></div>' +
    '<div class="ratings">' + chips.map(function (c) { return '<span class="chip">' + c + '</span>'; }).join('') + '</div>' +
    '<div class="ratings genres">' + f.genres.map(function (g) { return '<button class="chip genre" data-genre="' + esc(g) + '">' + esc(g) + '</button>'; }).join('') + '</div>' +
    '<p class="desc">' + f.desc + '</p>' +
    '<div class="watch"><strong>How to watch:</strong> ' + f.watch + '</div>' +
    '<div class="links">' + links + '<label class="seen"><input type="checkbox"' + (seen(f.id) ? ' checked' : '') + '> Watched</label></div>' +
    '</div></article>';
}

function render() {
  var q = $('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  var type = $('fType').value, where = $('fWhere').value, g = $('fGenre').value, ng = $('fNotGenre').value;
  var y0 = +$('fYearMin').value || Y0, y1 = +$('fYearMax').value || Y1, min = +$('fScore').value;
  var hide = $('fHideSeen').checked;

  var rows = FILMS.filter(function (f) {
    if (q.some(function (w) { return f.text.indexOf(w) < 0; })) return false;
    if (type && f.type !== type) return false;
    if (where && f.where.indexOf(where) < 0) return false;
    if (g && f.genres.indexOf(g) < 0) return false;
    if (ng && f.genres.indexOf(ng) >= 0) return false;
    if (f.year < y0 || f.year > y1) return false;
    if (min > 0 && (f.score == null || f.score < min)) return false;
    if (hide && seen(f.id)) return false;
    return true;
  });

  var k = state.sort, d = state.dir;
  rows.sort(function (a, b) {
    var x = a[k], y = b[k];
    if (x == null && y == null) return a.title.localeCompare(b.title);
    if (x == null) return 1;            // unknowns always last
    if (y == null) return -1;
    if (k === 'title') return d * x.localeCompare(y);
    return d * (x - y) || a.title.localeCompare(b.title);
  });

  $('count').textContent = rows.length + ' of ' + FILMS.length + ' titles';
  $('list').innerHTML = rows.length ? rows.map(card).join('') : '<div class="empty">Nothing matches. Try <button class="link-btn" onclick="reset()">resetting the filters</button>.</div>';
  $('list').className = state.view === 'grid' ? 'grid' : '';
  $('dir').textContent = d < 0 ? '↓' : '↑';
  $('vList').classList.toggle('on', state.view !== 'grid');
  $('vGrid').classList.toggle('on', state.view === 'grid');
}

// ---------- events ----------
['q', 'fType', 'fWhere', 'fGenre', 'fNotGenre', 'fYearMin', 'fYearMax', 'fHideSeen'].forEach(function (id) {
  $(id).addEventListener('input', render);
});
$('fScore').addEventListener('input', function () { $('fScoreVal').textContent = this.value; render(); });
$('sort').addEventListener('change', function () { state.sort = this.value; state.dir = DEFAULT_DIR[this.value]; render(); });
$('dir').addEventListener('click', function () { state.dir *= -1; render(); });
$('vList').addEventListener('click', function () { state.view = 'list'; store('movies-view', 'list'); render(); });
$('vGrid').addEventListener('click', function () { state.view = 'grid'; store('movies-view', 'grid'); render(); });
$('reset').addEventListener('click', reset);
$('toggleFilters').addEventListener('click', function () {
  var f = $('filters'); f.hidden = !f.hidden;
  this.setAttribute('aria-expanded', !f.hidden); this.textContent = f.hidden ? 'Filters ▾' : 'Filters ▴';
});

$('list').addEventListener('click', function (e) {
  var t = e.target.closest('.trailer[data-yt]');
  if (t && !t.querySelector('iframe')) {
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + t.dataset.yt + '?autoplay=1&rel=0';
    f.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
    f.allowFullscreen = true;
    t.appendChild(f);
    return;
  }
  var g = e.target.closest('.genre');
  if (g) { $('fGenre').value = g.dataset.genre; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
});
$('list').addEventListener('change', function (e) {
  if (!e.target.matches('.seen input')) return;
  var card = e.target.closest('.film');
  store('movies-seen-' + card.dataset.id, e.target.checked ? '1' : '0');
  card.classList.toggle('done', e.target.checked);
  if ($('fHideSeen').checked) render();
});

$('fYearMin').value = Y0; $('fYearMax').value = Y1;
render();
</script>
</body>
</html>
